<html>
<head>
  <meta charset="UTF-8"/>
  <title>Dessin SVG avec d3.js</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
</head>
<body>
  <svg xmlns="http://www.w3.org/2000/svg" id="dessin"></svg>

  <script type="module">

function PartitionFloue(trapezes, transform = null) {

    const svg = d3.select("#dessin");
    const width = 600;
    const height = width / 4;

    const margin = {
      top: 20,
      right: 10,
      bottom: 20,
      left: 10
    };

    const test = height - margin.bottom;

    const N = trapezes.length;

    const fy = d3.scaleLinear()
      .domain([0, 1])
      .range([height - margin.bottom, margin.top]);

    let fx = d3.scaleLinear()
      .domain([trapezes[0].supL - 1, trapezes[N - 1].supH + 1])
      .range([margin.left, width - margin.right]);
    if (transform != null) {
      fx = transform.rescaleX(fx) 
    } else {
      
      const zoom = d3.zoom()
        .extent([[0, 0], [width, height]])
        .scaleExtent([0.25, 64])
        .on("zoom", ({transform}) => PartitionFloue(trapezes, transform))
      svg.call(zoom)
    }

    svg.attr("width", width).attr("height", height);

    const fColor = d3.scaleOrdinal()
        .domain(trapezes.map(trp => trp.id))
        .range(d3.schemeSet2);
        
    function couleur(trp) {
      return fColor(trp.id);
    }

    svg.appendIfAbsent("#axeBas", "g")
      .attr("id", "axeBas")
      .attr("transform", `translate(0,${test})`)
      .call(d3.axisBottom(fx));

    svg.appendIfAbsent("#axeHaut", "g")
      .attr("id", "axeHaut")
      .attr("transform", `translate(0,${margin.top})`)
      .call(d3.axisTop(fx));
    
    const grpTrapezes = svg.appendIfAbsent("#grpTrapezes", "g")
      .attr("id", "grpTrapezes")
      .attr("text-anchor", "middle");

    grpTrapezes
      .selectAll("g")
      .data(trapezes, d => d.id)
      .join(
        enter => {
          const g = enter.append("g");

          g.append("path")
            .attr("d", d => {
              const a = [
                [fx(d.supL), fy(0)],
                [fx(d.corL), fy(1)],
                [fx(d.corH), fy(1)],
                [fx(d.supH), fy(0)]
              ];
              return d3.line()(a) + "Z";
            })
            .attr("stroke", couleur)
            .attr("stroke-width", 2)
            .attr("fill", couleur)
            .attr("fill-opacity", 0.4);

          g.append("text")
            .text(d => d.nom)
            .attr("x", d => (fx(d.corL) + fx(d.corH)) / 2)
            .attr("y", fy(0.5));

          return g;
        },
        update => update
          .call(g => {
            g.select("path")
              .attr("d", d => {
                const a = [
                  [fx(d.supL), fy(0)],
                  [fx(d.corL), fy(1)],
                  [fx(d.corH), fy(1)],
                  [fx(d.supH), fy(0)]
                ];
                return d3.line()(a) + "Z";
              })
              .attr("stroke", couleur)
              .attr("fill", couleur);

            g.select("text")
              .text(d => d.nom)
              .attr("x", d => (fx(d.corL) + fx(d.corH)) / 2)
              .attr("y", fy(0.5));
          })
      );

    console.log("TRAPEZES", trapezes)
}

const Trapezes = [
    { id: 0, supL: 5, corL: 11, corH: 14, supH: 18, nom: "froid" },
    { id: 1, supL: 14, corL: 18, corH: 20, supH: 22, nom: "frais" },
    { id: 2, supL: 20, corL: 22, corH: 24, supH: 30, nom: "tiède" },
    { id: 3, supL: 24, corL: 30, corH: 38, supH: 42, nom: "chaud" },
]

const Trapezes2 = [
    { id: -1, supL: 0, corL: 0, corH: 5, supH: 11, nom: "glacial" },
    ...Trapezes, // ajout ici des éléments de Trapezes
    { id: 4, supL: 38, corL: 42, corH: 60, supH: 80, nom: "brûlant" },
]

// voir https://stackoverflow.com/a/65056488 (append if not exist)
d3.selection.prototype.appendIfAbsent = function(selector, type) {
  const element = this.select(selector)
  return element.empty() ? this.append(type) : element
}

PartitionFloue(Trapezes);

// Testé à l'étape 8

  </script>
</body>
</html>
